name: Security lock refresh

on:
  push:
    branches:
      - fix/root-dependency-security
    paths:
      - .github/workflows/security-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply targeted security patch
        run: node .github/scripts/prepare-dependency-security-fix.mjs
      - name: Validate clean install and audits
        run: |
          npm ci
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
      - name: Commit targeted patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/backend-ci.yml docs/dependency-security.md
          git diff --cached --check
          git commit -m "fix: corrige advisories transitivos da raiz"
          git push
