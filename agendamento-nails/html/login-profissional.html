<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Profissional</title>
  <link rel="stylesheet" href="../css/login-profissional.css">
</head>

<body class="page-enter">
  <div class="auth-container">
    <div class="auth-icon">💅</div>

    <h2>Login Profissional</h2>
    <p class="auth-subtitle">Acesse sua agenda profissional</p>

    <form class="auth-form" onsubmit="return false;">
      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Digite seu e-mail">
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <div class="senha-box">
          <input type="password" id="senha" placeholder="Digite sua senha">
          <span class="toggle-senha" id="toggleSenha">🙈</span>
        </div>
      </div>

      <p id="mensagemLogin" class="mensagem-form hidden"></p>

      <button id="btnLoginProfissional" type="button">Entrar</button>
    </form>

    <p class="auth-footer">
      Não tem conta?
      <a href="cadastro-profissional.html">Cadastre-se</a>
    </p>

    <p class="auth-footer">
      Área do cliente?
      <a href="login-cliente.html">Entrar como cliente</a>
    </p>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/login-profissional.js"></script>
</body>
</html>
