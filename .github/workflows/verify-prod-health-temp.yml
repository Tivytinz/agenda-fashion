name: Verify production health temp

on:
  push:
    branches:
      - fix/admin-activation-ux-20260907

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify production readiness
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 20 https://app.agendafashion.com.br/health/ready)"
          echo "health_response=$response"
          node -e 'const body=JSON.parse(process.argv[1]); if(body.status!=="ready" || body.database!=="ok") { console.error(body); process.exit(1) }' "$response"
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-prod-health-temp.yml
          git commit -m "chore: remove verificação temporária de produção"
          git push origin HEAD:fix/admin-activation-ux-20260907
