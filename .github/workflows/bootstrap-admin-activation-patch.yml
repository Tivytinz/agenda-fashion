name: Bootstrap admin activation patch

on:
  push:
    branches:
      - fix/admin-activation-ux-20260907

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify expected base ancestry
        run: git merge-base --is-ancestor d1b056a5e306cc9a5d80686d0869fcac97a2b284 HEAD
      - name: Apply prepared patch
        shell: bash
        run: |
          cat > /tmp/patch.b64 <<'EOF'
          
          EOF
          tr -d '[:space:]' < /tmp/patch.b64 | base64 -d | gzip -d > /tmp/apply.py
          python /tmp/apply.py
      - name: Remove bootstrap workflow
        run: rm .github/workflows/bootstrap-admin-activation-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: alinha ativação administrativa ao primeiro agendamento"
          git push origin HEAD:fix/admin-activation-ux-20260907
