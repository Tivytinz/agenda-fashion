<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Encontre profissionais e negócios de beleza e agende online."
    />
    <meta name="theme-color" content="#c5246b" />
    <script>
      (() => {
        const path = window.location.pathname;
        const preload = document.createElement("link");

        if (path === "/") {
          preload.rel = "preload";
          preload.as = "image";
          preload.fetchPriority = "high";
          preload.href = window.matchMedia("(max-width: 767px)").matches
            ? "/assets/home/salon-hero-mobile.webp"
            : "/assets/home/salon-hero-wide.webp";
          document.head.append(preload);
          return;
        }

        const profileMatch = path.match(/^\/negocio\/([^/]+)\/?$/);

        if (profileMatch) {
          preload.rel = "preload";
          preload.as = "fetch";
          preload.crossOrigin = "use-credentials";
          preload.href = `/perfil-negocio/${profileMatch[1]}`;
          document.head.append(preload);
        }
      })();
    </script>
    <link
      rel="icon"
      type="image/webp"
      href="/src/assets/brand/performance/af-logo-96.webp"
    />
    <link
      rel="apple-touch-icon"
      href="/src/assets/brand/performance/af-logo-96.webp"
    />
    <!-- SOCIAL_META -->
    <title>Agenda Fashion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
