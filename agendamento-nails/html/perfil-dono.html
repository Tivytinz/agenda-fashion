<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Perfil do Dono</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/navegacao.css">
  <link rel="stylesheet" href="../css/perfil-dono.css">
</head>

<body>

  <main class="perfil-dono-page">

    <section class="perfil-card af-card">
      <div class="perfil-avatar">👤</div>

      <h1>Minha conta</h1>
      <p>Gerencie seus dados pessoais e segurança.</p>

      <div class="info-lista">
        <div>
          <span>Nome</span>
          <strong id="nomeUsuario">Carregando...</strong>
        </div>

        <div>
          <span>E-mail</span>
          <strong id="emailUsuario">Carregando...</strong>
        </div>

        <div>
          <span>Tipo</span>
          <strong>Dono do negócio</strong>
        </div>
      </div>

      <button id="btnAlterarSenha" class="btn-secundario" type="button">
        🔒 Alterar senha
      </button>

      <button id="btnSair" class="btn-sair" type="button">
        🚪 Sair da conta
      </button>
    </section>

  </main>

  <nav id="appNav" class="app-bottom-nav"></nav>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/perfil-dono.js"></script>
  <script src="../js/navegacao.js"></script>

</body>
</html>
