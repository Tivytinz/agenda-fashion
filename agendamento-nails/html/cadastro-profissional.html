<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Profissional</title>
  <link rel="stylesheet" href="../css/cadastro-profissional.css">
</head>

<body class="page-enter">
  <div class="auth-container">

    <div class="auth-icon">💅</div>

    <h2>Cadastro Profissional</h2>
    <p class="auth-subtitle">
      Crie sua conta profissional
    </p>

    <form class="auth-form" onsubmit="return false;">

      <div class="input-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Digite seu nome">
      </div>

      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Digite seu e-mail">
      </div>

      <div class="input-group">
        <label for="whatsapp">WhatsApp</label>
        <input type="text" id="whatsapp" placeholder="(62) 99999-9999">
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <div class="senha-box">
          <input type="password" id="senha" placeholder="Digite sua senha">
          <span class="toggle-senha" id="toggleSenha">🙈</span>
        </div>
      </div>

      <div class="input-group">
        <label for="confirmarSenha">Confirmar senha</label>
        <div class="senha-box">
          <input type="password" id="confirmarSenha" placeholder="Digite novamente a senha">
          <span class="toggle-senha" id="toggleConfirmarSenha">🙈</span>
        </div>
      </div>

      <p id="mensagemCadastro" class="mensagem-form hidden"></p>

      <button id="btnCadastroProfissional" type="button">
        Cadastrar
      </button>

    </form>

    <p class="auth-footer">
      Já tem conta?
      <a href="login-profissional.html">Entrar</a>
    </p>
  </div>

  <script src="../js/cadastro-profissional.js"></script>


</body>
</html>
