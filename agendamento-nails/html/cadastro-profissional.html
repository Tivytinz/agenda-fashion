<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Crie sua conta no Agenda Fashion e comece a administrar seu negócio."
  >

  <title>
    Começar como profissional | Agenda Fashion
  </title>

  <link
    rel="stylesheet"
    href="../css/auth.css"
  >
</head>

<body class="page-enter">
  <main class="auth-container">
    <div
      class="auth-icon"
      aria-hidden="true"
    >
      💅
    </div>

    <h1>
      Comece como profissional
    </h1>

    <p class="auth-subtitle">
      Crie sua conta para configurar e administrar seu negócio.
    </p>

    <form
      id="formCadastroProfissional"
      class="auth-form"
      novalidate
    >
      <div class="input-group">
        <label for="nome">
          Nome completo
        </label>

        <input
          id="nome"
          name="nome"
          type="text"
          placeholder="Digite seu nome completo"
          autocomplete="name"
          minlength="2"
          maxlength="120"
          required
        >
      </div>

      <div class="input-group">
        <label for="email">
          E-mail
        </label>

        <input
          id="email"
          name="email"
          type="email"
          placeholder="voce@email.com"
          autocomplete="email"
          maxlength="160"
          autocapitalize="none"
          spellcheck="false"
          required
        >
      </div>

      <div class="input-group">
        <label for="whatsapp">
          WhatsApp
        </label>

        <input
          id="whatsapp"
          name="whatsapp"
          type="tel"
          placeholder="(62) 99999-9999"
          autocomplete="tel"
          inputmode="numeric"
          maxlength="15"
          required
        >
      </div>

      <div class="input-group">
        <label for="senha">
          Senha
        </label>

        <div class="senha-box">
          <input
            id="senha"
            name="senha"
            type="password"
            placeholder="Mínimo de 6 caracteres"
            autocomplete="new-password"
            minlength="6"
            maxlength="72"
            required
          >

          <button
            id="toggleSenha"
            class="toggle-senha"
            type="button"
            aria-label="Mostrar senha"
            aria-pressed="false"
          >
            🙈
          </button>
        </div>
      </div>

      <div class="input-group">
        <label for="confirmarSenha">
          Confirmar senha
        </label>

        <div class="senha-box">
          <input
            id="confirmarSenha"
            name="confirmarSenha"
            type="password"
            placeholder="Digite a senha novamente"
            autocomplete="new-password"
            minlength="6"
            maxlength="72"
            required
          >

          <button
            id="toggleConfirmarSenha"
            class="toggle-senha"
            type="button"
            aria-label="Mostrar confirmação da senha"
            aria-pressed="false"
          >
            🙈
          </button>
        </div>
      </div>

      <p class="senha-ajuda">
        A senha deve ter entre 6 e 72 caracteres.
      </p>

      <p
        id="mensagemCadastro"
        class="mensagem-form hidden"
        role="alert"
        aria-live="polite"
      ></p>

      <button
        id="btnCadastroProfissional"
        type="submit"
        disabled
      >
        Criar conta
      </button>
    </form>

    <p class="auth-footer">
      Já possui uma conta?

      <a href="login-profissional.html">
        Entrar
      </a>
    </p>

    <p class="auth-footer">
      Quer apenas agendar serviços?

      <a href="cadastro-cliente.html">
        Criar conta para agendar
      </a>
    </p>
  </main>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/services/authService.js"></script>
<script src="../js/cadastro-profissional.js"></script>
</html>
