name: Performance QA

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: URL base do ambiente representativo
        required: false
        default: https://agendafashion.com.br
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/performance-qa.yml"
      - "scripts/performance-api-p95.mjs"
      - "frontend/index.html"
      - "frontend/vite.config.js"
      - "src/server.js"
      - "src/utils/httpCache.js"
      - "src/services/socialPreviewService.js"
      - "frontend/scripts/performance-lcp.mjs"
      - "frontend/public/assets/home/**"
      - "frontend/src/App.jsx"
      - "frontend/src/pages/HomePage.jsx"
      - "frontend/src/components/HomeHero.jsx"
      - "frontend/src/pages/ExplorePage.jsx"
      - "frontend/src/pages/ProfilePage.jsx"
      - "frontend/src/components/profile/**"
      - "frontend/src/styles/home-discovery.css"
      - "frontend/src/styles/profile-polish.css"
      - "frontend/src/styles/public-shell.css"
      - "frontend/src/styles/public-design-system.css"
  push:
    branches:
      - perf/p1-wave-15

permissions:
  contents: read

concurrency:
  group: performance-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    name: Performance gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: agenda_fashion_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agenda_fashion_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PERF_TARGET_URL: http://127.0.0.1:4173
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agenda_fashion_test
      JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
      ASAAS_API_URL: https://api-sandbox.asaas.com/v3
      ASAAS_API_KEY: ci-asaas-key
      ASAAS_WEBHOOK_TOKEN: ci-webhook-token-with-at-least-32-characters
      WHATSAPP_NOTIFICATIONS_ENABLED: "false"
      BACKGROUND_WORKERS_ENABLED: "false"
      PERF_API_SAMPLES: "30"
      PERF_API_CONCURRENCY: "3"
      PERF_API_P95_MS: "2000"
      PERF_LCP_RUNS: "3"
      PERF_LCP_MS: "2500"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm ci

      - name: Wait for target readiness
        shell: bash
        run: |
          for attempt in {1..18}; do
            if curl --fail --silent --show-error \
              --max-time 10 \
              "${PERF_TARGET_URL%/}/health/ready" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Ambiente alvo não ficou pronto dentro da janela de QA." >&2
          exit 1

      - name: Measure production API p95
        env:
          PERF_TARGET_URL: ${{ github.event.inputs.target_url || 'https://agendafashion.com.br' }}
        run: node scripts/performance-api-p95.mjs

      - name: Verify Lighthouse runtime
        shell: bash
        run: |
          google-chrome --version
          command -v xvfb-run
          npx --yes lighthouse@13.5.0 --version

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build branch frontend
        run: npm --prefix frontend run build

      - name: Apply test migrations
        run: npm run migrate:test

      - name: Seed isolated performance profile
        run: node scripts/seed-performance-ci.js

      - name: Start branch Express application
        shell: bash
        run: |
          PORT=4173 node scripts/start-performance-ci.js > /tmp/af-perf-preview.log 2>&1 &
          echo $! > /tmp/af-perf-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/health/ready >/dev/null || { cat /tmp/af-perf-preview.log >&2; exit 1; }
          curl --fail --silent http://127.0.0.1:4173/negocio/performance-ci | grep -q 'af-profile-initial-data' || { cat /tmp/af-perf-preview.log >&2; exit 1; }

      - name: Measure branch mobile LCP
        working-directory: frontend
        env:
          PERF_TARGET_URL: http://127.0.0.1:4173
          PERF_PROFILE_SLUG: performance-ci
        run: xvfb-run -a node scripts/performance-lcp.mjs

      - name: Stop branch preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/af-perf-preview.pid ]; then
            kill "$(cat /tmp/af-perf-preview.pid)" || true
          fi

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-qa-${{ github.run_id }}
          path: performance-results
          if-no-files-found: warn
          retention-days: 30
