name: Performance QA

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: URL base do ambiente representativo
        required: false
        default: https://app.agendafashion.com.br
  push:
    branches:
      - perf/p1-wave-15

permissions:
  contents: read

concurrency:
  group: performance-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    name: Performance gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PERF_TARGET_URL: ${{ github.event.inputs.target_url || 'https://app.agendafashion.com.br' }}
      PERF_API_SAMPLES: "30"
      PERF_API_CONCURRENCY: "3"
      PERF_API_P95_MS: "2000"
      PERF_LCP_RUNS: "3"
      PERF_LCP_MS: "2500"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for target readiness
        shell: bash
        run: |
          for attempt in {1..18}; do
            if curl --fail --silent --show-error \
              --max-time 10 \
              "${PERF_TARGET_URL%/}/health/ready" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Ambiente alvo não ficou pronto dentro da janela de QA." >&2
          exit 1

      - name: Measure API p95
        run: node scripts/performance-api-p95.mjs

      - name: Verify Lighthouse runtime
        shell: bash
        run: |
          google-chrome --version
          command -v xvfb-run
          npx --yes lighthouse@13.5.0 --version

      - name: Build branch frontend
        run: npm --prefix frontend run build

      - name: Start branch preview
        shell: bash
        env:
          PERF_API_PROXY_TARGET: https://app.agendafashion.com.br
        run: |
          npm --prefix frontend exec -- vite preview --host 127.0.0.1 --port 4173 > /tmp/af-perf-preview.log 2>&1 &
          echo $! > /tmp/af-perf-preview.pid
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/af-perf-preview.log >&2
          exit 1

      - name: Measure branch mobile LCP
        working-directory: frontend
        env:
          PERF_TARGET_URL: http://127.0.0.1:4173
        run: xvfb-run -a node scripts/performance-lcp.mjs

      - name: Stop branch preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/af-perf-preview.pid ]; then
            kill "$(cat /tmp/af-perf-preview.pid)" || true
          fi

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-wave-15-${{ github.run_id }}
          path: performance-results
          if-no-files-found: warn
          retention-days: 30
