<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Crie sua conta no Agenda Fashion para agendar serviços."
  >

  <meta name="theme-color" content="#d92f7f">

  <title>Crie sua conta | Agenda Fashion</title>

  <link
    rel="stylesheet"
    href="../css/auth.css"
  >

  <link rel="stylesheet" href="../css/refresh.css?v=2026.1">
</head>

<body
  class="page-enter"
  data-af-tela="cadastro_cliente"
  data-af-missao="criar_conta_cliente"
>
  <main class="auth-container">
    <div
      class="auth-icon"
      aria-hidden="true"
    >
      💅
    </div>

    <h1>Crie sua conta</h1>

    <p class="auth-subtitle">
      Cadastre-se para agendar seus horários.
    </p>

    <form
      id="formCadastroCliente"
      class="auth-form"
      novalidate
    >
      <div class="input-group">
        <label for="nome">
          Nome
        </label>

        <input
          id="nome"
          name="nome"
          type="text"
          placeholder="Digite seu nome"
          autocomplete="given-name"
          minlength="2"
          maxlength="60"
          required
        >
      </div>

      <div class="input-group">
        <label for="sobrenome">
          Sobrenome
        </label>

        <input
          id="sobrenome"
          name="sobrenome"
          type="text"
          placeholder="Digite seu sobrenome"
          autocomplete="family-name"
          minlength="2"
          maxlength="60"
          required
        >
      </div>

      <div class="input-group">
        <label for="email">
          E-mail
        </label>

        <input
          id="email"
          name="email"
          type="email"
          placeholder="voce@email.com"
          autocomplete="email"
          maxlength="160"
          autocapitalize="none"
          spellcheck="false"
          required
        >
      </div>

      <div class="input-group">
        <label for="whatsapp">
          WhatsApp
        </label>

        <input
          id="whatsapp"
          name="whatsapp"
          type="tel"
          placeholder="(62) 99999-9999"
          autocomplete="tel"
          inputmode="numeric"
          maxlength="15"
          required
        >
      </div>

      <div class="input-group">
        <label for="senha">
          Senha
        </label>

        <div class="senha-box">
          <input
            id="senha"
            name="senha"
            type="password"
            placeholder="Mínimo de 6 caracteres"
            autocomplete="new-password"
            minlength="6"
            maxlength="72"
            required
          >

          <button
            id="toggleSenha"
            class="toggle-senha"
            type="button"
            aria-label="Mostrar senha"
            aria-pressed="false"
          >
            🙈
          </button>
        </div>
      </div>

      <div class="input-group">
        <label for="confirmarSenha">
          Confirmar senha
        </label>

        <div class="senha-box">
          <input
            id="confirmarSenha"
            name="confirmarSenha"
            type="password"
            placeholder="Digite a senha novamente"
            autocomplete="new-password"
            minlength="6"
            maxlength="72"
            required
          >

          <button
            id="toggleConfirmarSenha"
            class="toggle-senha"
            type="button"
            aria-label="Mostrar confirmação da senha"
            aria-pressed="false"
          >
            🙈
          </button>
        </div>
      </div>

      <p class="senha-ajuda">
        A senha deve ter entre 6 e 72 caracteres.
      </p>

      <p
        id="mensagemCadastro"
        class="mensagem-form hidden"
        role="alert"
        aria-live="polite"
      ></p>

      <button
        id="btnCadastroCliente"
        type="submit"
        disabled
      >
        Criar conta
      </button>
    </form>

    <p class="auth-footer">
      Já possui uma conta?

      <a href="login-cliente.html">
        Entrar
      </a>
    </p>

    <p class="auth-footer">
      Quer criar seu próprio negócio?

      <a href="cadastro-profissional.html">
        Começar como profissional
      </a>
    </p>
  </main>

<script src="../js/config.js"></script>
<script src="../js/analytics.js"></script>
<script src="../js/api.js"></script>
<script src="../js/services/authService.js"></script>
<script src="../js/cadastro-cliente.js"></script>
</body>
</html>
