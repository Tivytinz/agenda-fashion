name: ADM v2 audit lock fix

on:
  push:
    branches:
      - chore/adm-v2-audit-fix

permissions:
  contents: write

jobs:
  fix-lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/adm-v2-audit-fix

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh audited lockfiles
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          npm --prefix frontend audit fix --package-lock-only --ignore-scripts || true
          git checkout -- package.json frontend/package.json

      - name: Verify audits
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
          npm --prefix frontend audit --audit-level=high

      - name: Commit lockfile fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/adm-v2-audit-lock-fix.yml
          git add package-lock.json frontend/package-lock.json
          git commit -m "chore: corrige auditoria de dependências do ADM v2"
          git push origin HEAD:chore/adm-v2-audit-fix
