name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agenda_fashion_test
  JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
  ASAAS_API_URL: https://api-sandbox.asaas.com/v3
  ASAAS_API_KEY: ci-asaas-key
  ASAAS_WEBHOOK_TOKEN: ci-webhook-token-with-at-least-32-characters
  WHATSAPP_NOTIFICATIONS_ENABLED: "false"

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Lint React frontend
        run: npm --prefix frontend run lint

      - name: Check frontend dead code
        run: npm --prefix frontend run check:dead-code

      - name: Build React frontend
        run: npm run frontend:build

      - name: Test React frontend
        run: npm run frontend:test

      - name: Audit backend and tooling dependencies
        run: npm audit --audit-level=high

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit frontend dependencies
        run: npm --prefix frontend audit --audit-level=high

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: agenda_fashion_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agenda_fashion_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply test migrations
        run: npm run migrate:test

      - name: Run tests with coverage
        run: npm run test:coverage

  e2e:
    name: End-to-end quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: agenda_fashion_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agenda_fashion_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build React frontend
        run: npm run frontend:build

      - name: Apply test migrations
        run: npm run migrate:test

      - name: Install mobile browsers
        run: npm --prefix frontend exec -- playwright install --with-deps chromium webkit

      - name: Test mobile frontend
        run: npm --prefix frontend run test:e2e

      - name: Test full-stack acceptance
        run: npm --prefix frontend run test:e2e:fullstack

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 3

  quality-gate:
    name: Quality gate
    if: always()
    needs:
      - frontend
      - backend
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify required jobs
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$FRONTEND_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$E2E_RESULT" = "success"
