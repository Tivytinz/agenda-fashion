<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Entre na sua conta do Agenda Fashion para acompanhar seus agendamentos."
  >

  <meta name="theme-color" content="#d92f7f">

  <title>Entrar | Agenda Fashion</title>

  <link
    rel="stylesheet"
    href="../css/auth.css"
  >

  <link rel="stylesheet" href="../css/refresh.css?v=2026.1">
</head>

<body
  class="page-enter"
  data-af-tela="login_cliente"
  data-af-missao="entrar_cliente"
>
  <main class="auth-container">
    <div
      class="auth-icon"
      aria-hidden="true"
    >
      💅
    </div>

    <h1>Entre na sua conta</h1>

    <p class="auth-subtitle">
      Acesse seus agendamentos e encontre novos serviços.
    </p>

    <form
      id="formLoginCliente"
      class="auth-form"
      novalidate
    >
      <div class="input-group">
        <label for="email">
          E-mail
        </label>

        <input
          id="email"
          name="email"
          type="email"
          placeholder="voce@email.com"
          autocomplete="email"
          maxlength="160"
          autocapitalize="none"
          spellcheck="false"
          required
        >
      </div>

      <div class="input-group">
        <label for="senha">
          Senha
        </label>

        <div class="senha-box">
          <input
            id="senha"
            name="senha"
            type="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            maxlength="72"
            required
          >

          <button
            id="toggleSenha"
            class="toggle-senha"
            type="button"
            aria-label="Mostrar senha"
            aria-pressed="false"
          >
            🙈
          </button>
        </div>
      </div>

      <p
        id="mensagemLogin"
        class="mensagem-form hidden"
        role="alert"
        aria-live="polite"
      ></p>

      <button
        id="btnLoginCliente"
        type="submit"
        disabled
      >
        Entrar
      </button>
    </form>

    <p class="auth-footer">
      Ainda não possui uma conta?

      <a href="cadastro-cliente.html">
        Criar conta
      </a>
    </p>

    <p class="auth-footer">
      Quer administrar um negócio?

      <a href="login-profissional.html">
        Área profissional
      </a>
    </p>

    <p class="auth-footer">
      <a href="inicio.html">
        Voltar para o início
      </a>
    </p>
  </main>

  <!--
    A ordem é obrigatória:

    config.js
    → define API_URL

    api.js
    → cria window.API

    authService.js
    → utiliza window.API

    login-cliente.js
    → utiliza window.AuthService
  -->
  <script src="../js/config.js"></script>
  <script src="../js/analytics.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/services/authService.js"></script>
  <script src="../js/login-cliente.js"></script>
</body>
</html>
