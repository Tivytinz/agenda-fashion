<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Negócio</title>
  <link rel="stylesheet" href="../css/painel-profissional.css">
  <link rel="stylesheet" href="../css/navegacao.css">
</head>
<body>

  <main class="painel-negocio">
    <section class="container-painel">

      <!-- HEADER -->
      <header class="topo-painel">
        <div>
          <h1>Painel do Negócio 💅</h1>
          <p>Gerencie agenda e atendimentos</p>
        </div>

        <div class="topo-direita">
          <button id="btnDashboard" class="btn-dashboard">Dashboard</button>
          <button id="btnSair" class="btn-sair">Sair</button>
        </div>
      </header>

      <section class="dashboard-box info-negocio-box">
  <div class="info-negocio-topo">
    <div>
      <span class="info-label">Negócio atual</span>
      <h3 id="nomeNegocioAtual">Carregando...</h3>
      <p id="slugNegocioAtual" class="info-slug">--</p>
    </div>

    <div class="info-negocio-acoes">
      <a id="btnPerfilPublico" class="btn-link" href="#" target="_blank" rel="noopener noreferrer">
        Ver perfil público
      </a>
    </div>
  </div>

  <div class="info-profissional-linha">
    <span class="info-profissional-item">
      <strong>Profissional:</strong>
      <span id="nomeProfissionalAtual">--</span>
    </span>
  </div>
</section>

      <!-- ALERTA -->
      <div id="mensagemPainel" class="mensagem-painel oculto"></div>

      <!-- CARDS (AGORA IGUAL DASHBOARD) -->
      <section class="dashboard-cards">

        <div class="dashboard-card">
          <span>Total de agendados</span>
          <h2 id="totalAgendados">0</h2>
        </div>

        <div class="dashboard-card">
          <span>Clientes recorrentes</span>
          <h2 id="totalRecorrentes">0</h2>
        </div>

        <div class="dashboard-card">
          <span>Clientes novos</span>
          <h2 id="totalNovos">0</h2>
        </div>

        <div class="dashboard-card destaque">
          <span>Hoje</span>
          <h2 id="totalHoje">0</h2>
        </div>

      </section>

      <!-- AGENDA -->
      <section class="dashboard-box">

        <div class="cabecalho-agenda">
          <div>
            <h3>
              Agenda visual de
              <span id="diaAgendaTexto">Hoje 💅 • Segunda-feira • 20/04</span>
            </h3>

            <div id="abasDias" class="abas-dias"></div>
          </div>

          <div class="resumo-status">
            <span>🟢 Livres: <strong id="qtdLivres">0</strong></span>
            <span>|</span>
            <span>🔴 Bloqueados: <strong id="qtdBloqueados">0</strong></span>
            <span>|</span>
            <span>🟠 Agendados: <strong id="qtdAgendados">0</strong></span>
          </div>
        </div>

        <div id="agendaVisual" class="agenda-grid"></div>

      </section>

    </section>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/painel-profissional.js"></script>

  <nav id="appNav" class="app-bottom-nav"></nav>
<script src="../js/navegacao.js"></script>

</body>
</html>
